# Typikon ships no MCP server and no HTTP routes; these arrays are intentionally empty
# but declared so the LLM-schema validator passes. Top-level keys must precede any
# table declarations under TOML semantics.
mcp_tools = []
http_routes = []

[meta]
name = "typikon"
repo = "forkwright/typikon"
generated = false
source_docs = [
  "README.md",
  "CLAUDE.md",
  "bin/",
]

[apis]
summary = "Typikon exposes local CLI scripts for scaffolding, validation, migration, and CI checks. No MCP server surface and no HTTP routes; all interaction is via the local CLIs enumerated below."

[[cli_commands]]
name = "bin/typikon-init"
purpose = "Scaffold a new consumer site or content primitive."

[[cli_commands]]
name = "bin/typikon-validate"
purpose = "Validate consumer site frontmatter against typikon schemas."

[[cli_commands]]
name = "bin/typikon-check"
purpose = "Run local site gate: validation, Zola checks/build, CSP, and optional external tools."

[[cli_commands]]
name = "bin/typikon-migrate-template"
purpose = "Apply template/schema migrations for consumers."

[[cli_commands]]
name = "bin/typikon-refresh"
purpose = "Re-render consumer-side templates after an upstream bump."

[[cli_commands]]
name = "ci/verify-release-lock.py"
purpose = "Replay a typed two-consumer compatibility lock against exact Git and GitHub evidence."

[[cli_commands]]
name = "ci/publish-locked-release.py"
purpose = "Inspect, resume, or publish the exact annotated tag and locked release assets."
