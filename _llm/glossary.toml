[meta]
name = "typikon"
repo = "forkwright/typikon"
generated = false
source_docs = [
  "README.md",
  "CLAUDE.md",
]

[glossary]
description = "Domain vocabulary for typikon."

[[terms]]
term = "typikon"
definition = "Rule of execution; the fleet web-property substrate."
canonical = true

[[terms]]
term = "consumer site"
definition = "A site that pins typikon as a submodule and supplies content/brand config."
canonical = true

[[terms]]
term = "consumer schema registry"
definition = "schemas/registry.toml — maps a consumer's custom template or content path to its own JSON Schema, checked in at the consumer site."
canonical = true

[[terms]]
term = "core schema"
definition = "An open (no additionalProperties/unevaluatedProperties) building-block schema (page.core.schema.json, section.core.schema.json) that both typikon's own closed schema and a consumer's registered schema compose via $ref."
canonical = true

[[terms]]
term = "schema"
definition = "JSON Schema contract for a content type's frontmatter."
canonical = true

[[terms]]
term = "scaffold"
definition = "Template content copied by typikon-init."
canonical = true

[[terms]]
term = "strict CSP"
definition = "No-inline runtime policy enforced by headers and CI."
canonical = true
