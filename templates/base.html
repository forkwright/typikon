{# Typikon base template — shared shell for every page in a consumer site.
   Boundaries:
   - No inline <script>, <style>, or on*= handlers anywhere. Strict CSP enforces.
   - Page-vs-section discrimination is delegated via Tera blocks: page.html
     and section.html override `title_text`, `description_text`, etc.
     base.html does not access `page.*` or `section.*` directly so it works
     in every rendering context.
#}
<!DOCTYPE html>
<html lang="{{ lang | default(value="en") }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="{{ config.extra.theme_color | default(value="#F7F3E8") }}">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">

  {%- set site_title = config.title | default(value="") -%}
  {%- set default_description = config.description | default(value="") -%}

  <title>{% block title %}{{ site_title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ default_description }}{% endblock description %}">

  <meta property="og:title" content="{% block og_title %}{{ site_title }}{% endblock og_title %}">
  <meta property="og:description" content="{% block og_description %}{{ default_description }}{% endblock og_description %}">
  <meta property="og:type" content="{% block og_type %}website{% endblock og_type %}">
  <meta property="og:locale" content="{{ config.extra.og_locale | default(value="en_US") }}">
  {% block og_image -%}
    {%- if config.extra.og_image %}
  <meta property="og:image" content="{{ get_url(path=config.extra.og_image, trailing_slash=false) }}">
    {%- endif %}
  {%- endblock og_image %}
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="{{ current_url | default(value=config.base_url) }}">

  {# Self-hosted fonts. Preload the two highest-frequency files (configured
     by consumer's [extra.font_preload]); the rest load via fonts.css. #}
  {%- if config.extra.font_preload %}
    {%- for font in config.extra.font_preload %}
  <link rel="preload" href="{{ font }}" as="font" type="font/woff2" crossorigin>
    {%- endfor %}
  {%- endif %}
  <link rel="stylesheet" href="{{ get_url(path='css/fonts.css', trailing_slash=false) }}">
  <link rel="stylesheet" href="{{ get_url(path='css/style.css', trailing_slash=false) }}">

  {% block head_extra %}{% endblock head_extra %}
</head>
<body{% block body_class %}{% endblock body_class %}>
  <a href="#main" class="sr-only">Skip to content</a>

  {% block nav %}{% include "partials/nav.html" %}{% endblock nav %}

  <main id="main">
    {% block content %}{% endblock content %}
  </main>

  {% block footer %}{% include "partials/footer.html" %}{% endblock footer %}

  {% block scripts %}{% endblock scripts %}
</body>
</html>
