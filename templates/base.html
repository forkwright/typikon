{# Typikon base template — shared shell for every page in a consumer site.
   Boundaries:
   - No inline <script>, <style>, or on*= handlers anywhere. Strict CSP enforces.
   - Page-vs-section discrimination is delegated via Tera blocks: page.html
     and section.html override `title_text`, `description_text`, etc.
     base.html does not access `page.*` or `section.*` directly so it works
     in every rendering context.

   Consumer design/extension surface (forkwright/typikon#55) — a consumer
   never needs to shadow (copy) this file to add its own identity:
   - styles:      config.extra.consumer_css (list, config-driven) plus the
                   {% block styles %}{% endblock %} slot (template-driven)
   - head:        {% block head_extra %}{% endblock %}
   - nav:         {% block nav %}{% endblock %} (default: partials/nav.html)
   - footer:      {% block footer %}{% endblock %} (default: partials/footer.html)
   - structured data: {% block ld_json %}{% endblock %} (default: Organization)
   - scripts:     {% block scripts %}{% endblock %}
   - composition: {% block content %}{% endblock %}, plus title/description/
                   og_title/og_description/og_type/og_image/body_class
   A child template overrides only the block(s) it needs; every other block
   keeps rendering the default. See index.html for an example that overrides
   several at once.

   WHY the assert import below (forkwright/typikon#92): Tera resolves a
   macro namespace by which TEMPLATE an include tag is textually written
   in, not by the included partial's own imports, once that block is
   reached via extends plus a child's super() call (verified: a flat
   include honors the partial's own import; the identical include inside
   an inherited block that a child renders via super() does not — Tera
   attributes it to base.html regardless of which child called super()).
   partials/ld-organization.html is included directly in the ld_json
   block below and calls assert::required; every child template's own
   super() call would otherwise fail exactly the way an unimported macro
   namespace does.

   WARNING: this file tolerates only ONE leading comment block before its
   import statements — Tera's parser rejects a second, separate leading
   comment block ahead of an import with a parse error naming the import
   line (verified), so any addition here must stay inside this single
   comment, never a new one placed above the imports.
#}
{% import "partials/ld-breadcrumb.html" as crumb %}
{% import "partials/assert.html" as assert %}
<!DOCTYPE html>
<html lang="{{ lang | default(value="en") }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="{{ config.extra.theme_color | default(value="#F7F3E8") }}">
  {%- set favicon_path = config.extra.favicon_path | default(value="img/favicon.svg") -%}
  {%- set favicon_ext = favicon_path | split(pat=".") | last | lower -%}
  {%- if favicon_ext == "ico" -%}
    {%- set favicon_type = "image/x-icon" -%}
  {%- elif favicon_ext == "png" -%}
    {%- set favicon_type = "image/png" -%}
  {%- elif favicon_ext == "gif" -%}
    {%- set favicon_type = "image/gif" -%}
  {%- elif favicon_ext == "jpg" or favicon_ext == "jpeg" -%}
    {%- set favicon_type = "image/jpeg" -%}
  {%- elif favicon_ext == "webp" -%}
    {%- set favicon_type = "image/webp" -%}
  {%- else -%}
    {%- set favicon_type = "image/svg+xml" -%}
  {%- endif -%}
  <link rel="icon" href="{{ get_url(path=favicon_path, trailing_slash=false) }}" type="{{ favicon_type | safe }}">

  {%- set site_title = config.title | default(value="") -%}
  {%- set default_description = config.description | default(value="") -%}

  <title>{% block title %}{{ site_title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ default_description }}{% endblock description %}">

  <meta property="og:title" content="{% block og_title %}{{ site_title }}{% endblock og_title %}">
  <meta property="og:description" content="{% block og_description %}{{ default_description }}{% endblock og_description %}">
  <meta property="og:type" content="{% block og_type %}website{% endblock og_type %}">
  <meta property="og:locale" content="{{ config.extra.og_locale | default(value="en_US") }}">
  {% block og_image -%}
    {%- if config.extra.og_image %}
  <meta property="og:image" content="{{ get_url(path=config.extra.og_image, trailing_slash=false) }}">
    {%- endif %}
  {%- endblock og_image %}
  <meta name="twitter:card" content="summary">
  <meta property="og:url" content="{{ current_url | default(value=config.base_url) | safe }}">
  <link rel="canonical" href="{{ current_url | default(value=config.base_url) | safe }}">

  {# Atom feed auto-discovery so RSS readers / browsers find it without
     the visitor needing to know the URL. #}
  {%- if config.generate_feeds %}
  <link rel="alternate" type="application/atom+xml" href="/atom.xml" title="{{ config.title }}">
  {%- endif %}

  {# Self-hosted fonts. Preload the two highest-frequency files (configured
     by consumer's [extra.font_preload]); the rest load via fonts.css. #}
  {%- if config.extra.font_preload %}
    {%- for font in config.extra.font_preload %}
  <link rel="preload" href="{{ font | safe }}" as="font" type="font/woff2" crossorigin>
    {%- endfor %}
  {%- endif %}
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">

  {# Consumer stylesheet hook (forkwright/typikon#55): config.extra.consumer_css
     is a list of paths (e.g. ["css/skins/leather.css", "css/site.css"]),
     each rendered as a <link> here, in order, after core's own style.css —
     so a consumer's :root token overrides and any skin classes win the
     cascade without forking this file. bin/typikon-check-assets verifies
     every declared path resolves to a real file in the built site.
     {% block styles %}{% endblock styles %} is the template-level
     counterpart: a specific page/section template can add a stylesheet of
     its own the same way, without touching base.html either. #}
  {%- for href in config.extra.consumer_css | default(value=[]) %}
  <link rel="stylesheet" href="{{ get_url(path=href, trailing_slash=false) }}">
  {%- endfor %}
  {% block styles %}{% endblock styles %}

  {# Default JSON-LD: Organization on every page. Consumer page templates
     override this block to layer on Product/Article/BreadcrumbList. #}
  {% block ld_json %}
  {%- include "partials/ld-organization.html" -%}
  {% endblock ld_json %}

  {% block head_extra %}{% endblock head_extra %}
</head>
<body{% block body_class %}{% endblock body_class %}>
  <a href="#main" class="sr-only">Skip to content</a>

  {% block nav %}{% include "partials/nav.html" %}{% endblock nav %}

  <main id="main">
    {% block content %}{% endblock content %}
  </main>

  {% block footer %}{% include "partials/footer.html" %}{% endblock footer %}

  {% block scripts %}{% endblock scripts %}
</body>
</html>
