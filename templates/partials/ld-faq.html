{# Schema.org/FAQPage JSON-LD. Override the ld_json block from page.html
   on FAQ pages. Each question becomes a Question entity with an
   AcceptedAnswer.

   Inputs:
     page.extra.questions — array of {q, a, anchor?} per faq schema
#}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for item in page.extra.questions -%}
    {
      "@type": "Question",
      "name": {{ item.q | json_encode | safe }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.a | json_encode | safe }}
      }
    }{%- if not loop.last -%},{%- endif -%}
    {%- endfor %}
  ]
}
</script>
