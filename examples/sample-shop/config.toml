# Sample shop — exercises section + product + page + faq schemas.
title = "Sample Shop"
description = "A typikon fixture demonstrating section + product + page + faq schemas with a different brand identity than ardent or sample-blog."
base_url = "https://sample-shop.example.com"
default_language = "en"
output_dir = "public"
theme = "typikon"
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
smart_punctuation = true

[extra]
brand_name = "Sample Shop"
brand_greek = "Ἔργα"
logo_path = "img/logo.svg"
theme_color = "#F0EFE5"
og_locale = "en_US"
founding_date = "2026"

font_preload = ["/fonts/cormorant-garamond-variable.woff2", "/fonts/spectral-400.woff2"]

nav_items = [
  { url = "/products/", label = "products", greek = "ἔργα" },
  { url = "/about/",    label = "about",    greek = "περί" },
  { url = "/faq/",      label = "questions", greek = "ἐρωτήσεις" },
  { url = "/contact/",  label = "contact",  greek = "ἁφή" },
]

footer_links = [
  { url = "/about/", label = "About" },
]

[extra.author]
name = "Sample Maker"
uri = "https://sample-shop.example.com/about/"
