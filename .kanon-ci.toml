# archetype: B
# forge-only: false
# spdx: LicenseRef-PolyForm-Noncommercial-1.0.0

[pipeline]
stages = ["lint", "fixtures-gate"]

[stages.lint]
cmd = "kanon lint . --summary"
timeout_secs = 60

# WHY 240, not 180: ci/smoke/interactive-state-contrast.spec.ts
# (forkwright/typikon#64) adds a default/focus/hover/active getComputedStyle
# sweep across every route this stage's playwright run already builds for
# both example sites, inside the same budget the previous figure was sized
# for.
[stages.fixtures-gate]
cmd = "ci/run-fixtures.sh"
timeout_secs = 240

[verifier]
enabled = false
